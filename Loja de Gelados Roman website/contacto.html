<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gelataria Roman-Gelados Roman - Contacto</title>

<link href="https://jsdelivr.net" rel="stylesheet">


<link rel="stylesheet" href="css/estilos.css">
<link href="https://jsdelivr.net" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Menu -->
<nav class="navbar navbar-expand-lg sticky-top">
<div class="container">
<a class="navbar-brand" href="index.html">🍦 Gelataria Roman</a>
<div class="collapse navbar-collapse justify-content-end" id="navbarNav">
<ul class="navbar-nav">
<li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>
</ul>
</div>
</div>
</nav>

<!-- Secção de Contacto -->
<main class="container my-5">
<div class="row justify-content-center">
<div class="col-md-8 bg-white p-5 rounded-4 shadow-sm">
<h1 class="text-center fw-bold mb-4">Fala Connosco</h1>
<p class="text-center text-muted mb-5">Tens alguma dúvida ou queres fazer uma encomenda personalizada? Envia mensagem!</p>

<form>
<div class="mb-3">
<label for="nome" class="form-label fw-bold">Nome</label>
<input type="text" class="form-control" id="nome" placeholder="O teu nome" required>
</div>
<div class="mb-3">
<label for="email" class="form-label fw-bold">E-mail</label>
<input type="email" class="form-control" id="email" placeholder="nome@exemplo.com" required>
</div>
<div class="mb-3">
<label for="mensagem" class="form-label fw-bold">Mensagem / Pedido</label>
<textarea class="form-control" id="mensagem" rows="4" placeholder="Escreve aqui o teu pedido ou dúvida..." required></textarea>
</div>
<div class="text-center">
<button type="submit" class="btn btn-soft w-100 py-3 mt-2">Enviar Mensagem</button>
</div>
</form>

<hr class="my-5" style="color: var(--cor-secundaria);">

<!-- Informações extra de contacto -->
<div class="row text-center g-3">
<div class="col-md-6">
<h6 class="fw-bold mb-1">📍 Onde Estamos</h6>
<p class="text-muted small">Avenida Doce, nº 12, Lisboa</p>
</div>
<div class="col-md-6">
<h6 class="fw-bold mb-1">⏰ Horário</h6>
<p class="text-muted small">Todos os dias: 12:00 às 20:00</p>
</div>
</div>
</div>
</div>
</main>

<footer class="text-center text-muted mt-5">
<p class="mb-0"> 2026 Gelataria Roman.</p>
</footer>
</body>
</html>
